project:
  type: book
  output-dir: _book

book:
  title: "Equivalences"
  author: "Peleke Sengstacke"
  repo-url: https://github.com/Peleke/equivalences
  repo-actions: [source, issue]
  chapters:
    - index.qmd
    - 01-space-time.qmd
    - 02-waves.qmd
    - 03-ensembles.qmd
    - 04-sampling-dft.ipynb
    - 05-stft-spectrograms.ipynb
    - 06-isoclines.ipynb
    - 07-whats-in-a-wave.qmd
    - 08-what-odin-knew.qmd
  appendices:
    - references.qmd

# .ipynb chapters render from their stored outputs (Quarto does not execute notebooks by default).
# .qmd chapters execute locally and are frozen: commit _freeze/ so CI renders without Python.
execute:
  freeze: auto

format:
  html:
    theme: [litera, theme/equivalences.scss]
    toc: true
    code-fold: true
    code-summary: "Code"
    code-overflow: wrap
    highlight-style: github
    reference-location: margin
    citation-location: margin
